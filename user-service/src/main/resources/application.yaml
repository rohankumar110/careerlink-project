server:
  port: 9020
  servlet:
    context-path: /api/v1/users

spring:
  application:
    name: user-service

  web:
    resources:
      add-mappings: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://localhost:5432/user-db
    username: postgres
    password: "0000"

  jpa:
    hibernate:
      ddl-auto: update

app:
  security:
    jwt:
      secret-key: "C55FAE37DC87F5A9CA6D34B2D9DACB4D874FD84BAC429F7215C3C237EBF60E1D"
      # 1 hour in milliseconds = 1000 * 60 * 60 = 3600000
      access-token-expiration: 3600000