server:
  port: 9010
  servlet:
    context-path: /api/v1/posts

spring:
  application:
    name: post-service

  web:
    resources:
      add-mappings: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: jdbc:postgresql://localhost:5432/post-db
    username: postgres
    password: "0000"

  jpa:
    hibernate:
      ddl-auto: create-drop
